[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "C901",
]
fixable = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "C4",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = [
    "deepagents",
    "dotenv",
    "fastapi",
    "langchain",
    "langchain_core",
    "langchain_openai",
    "langgraph",
    "langchain_mcp_adapters",
    "pydantic",
]

[tool.ruff.lint.per-file-ignores]
"src/test/*.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
